# PR 이 열리거나 갱신되면 Claude 가 자동으로 리뷰한다.
#
# ## 왜 필요한가
#
# 이 레포는 커밋이 사실상 1인분이다 — 리뷰해 줄 사람이 없다. ci.yml 이
# `flutter analyze`·`flutter test` 로 **기계가 잡을 수 있는 것**은 잡지만,
# CLAUDE.md 에 적힌 제약은 테스트로 옮겨지지 않은 것이 대부분이다:
#
# - 시트에 `values.append` 아닌 쓰기를 했는지
# - 세 목적지(Sheets·Drive·Slack)를 독립으로 보내는지
# - 부가세를 자동 계산하지 않는지
# - 분류를 업체 이력에서, 비목을 카드에서 가져오는 반대 실수를 했는지
#
# 이런 건 `architecture_test.dart` 가 못 막는다. 그리고 시트는 append-only 라
# **틀린 행이 들어가면 앱으로 되돌릴 수 없다** — 머지 전에 걸리는 값이 크다.
#
# ## 설치 전제 — **이것이 되기 전에 master 로 머지하지 않는다**
#
# claude.yml 과 같다 — Claude GitHub App 설치 + `ANTHROPIC_API_KEY` 시크릿.
#
# 여기는 claude.yml 보다 급하다. 저쪽은 누가 `@claude` 를 적어야 돌지만
# 이쪽은 **PR 이 열릴 때마다 저절로 돈다** — 전제 없이 머지하면 모든 PR 에
# 인증 실패한 빨간 X 가 하나씩 붙는다.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 리뷰는 **읽고 코멘트만** 한다. 고치지 않으므로 contents 는 read 다.
#
# `pull-requests: read` 인데 인라인 코멘트를 쓸 수 있는 이유 — 코멘트는
# 워크플로 토큰이 아니라 Claude GitHub App 으로 올라간다.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

# 같은 PR 에 연달아 push 하면 앞선 리뷰를 버린다. 리뷰는 중간에 끊겨도
# 남는 것이 없으므로 ci.yml 과 같은 선택을 한다 — 마지막 코드만 보면 된다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # **fork 에서 온 PR 은 건너뛴다.** 공개 레포라 GitHub 이 fork PR 실행에
    # 시크릿을 안 내려준다 — 돌려봐도 인증 없이 실패하고, PR 마다 빨간 X 만
    # 남는다. (외부에서 우리 키로 러너를 못 돌린다는 뜻이기도 하다.)
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Flutter 툴체인을 **깔지 않는다.** 리뷰는 코드를 읽을 뿐 빌드하지
      # 않는다 — claude.yml 쪽 셋업(2~3분)을 여기서 반복할 이유가 없다.
      # 테스트가 통과하는지는 ci.yml 이 같은 PR 에서 따로 본다.

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"

          # `--comment` 가 있어야 리뷰가 **PR 에 달린다.** 빼면 결과가
          # 워크플로 실행 로그에만 남아서 아무도 안 본다.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # 스킬의 `allowed-tools` 가 같은 도구를 적어뒀어도 이 줄이 필요하다 —
          # 액션은 `claude_args` 의 `--allowedTools` 에 이름이 있을 때만
          # 인라인 코멘트를 올리는 MCP 서버를 띄운다.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
