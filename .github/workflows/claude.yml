# `@claude` 를 멘션하면 Claude 가 이슈·PR 에서 답하고 코드를 고친다.
#
# ## 왜 필요한가
#
# 이 레포의 할 일은 GitHub Issues 가 원본이다. 그런데 이슈를 적는 것과
# 그것을 코드로 옮기는 것 사이가 전부 수동이었다 — 이슈를 읽고, 로컬에서
# 브랜치를 따고, 고치고, PR 을 올린다. 작은 건(`비목 선택하면 키보드 내릴 것`)
# 까지 그 왕복을 하면 이슈가 쌓이기만 한다.
#
# 이슈 본문에 `@claude` 를 적으면 그 자리에서 PR 까지 간다.
#
# ## 설치 전제 — **이것이 되기 전에 master 로 머지하지 않는다**
#
# 1. `bodit-inc/bodit_app` 에 Claude GitHub App 이 설치돼 있어야 한다
#    — https://github.com/apps/claude · **repo admin 권한이 필요하다**
# 2. Actions secret 에 `ANTHROPIC_API_KEY` 가 있어야 한다
#    — Settings → Secrets and variables → Actions
#
# 둘 다 org owner(= 이 레포의 admin 4명)만 할 수 있다.
#
# 전제가 없는 상태로 머지하면 **조용히 꺼져 있지 않다.** 누가 `@claude` 를
# 적는 순간 러너가 떠서 인증 실패로 끝나고, 이슈마다 빨간 X 가 남는다.
# `secrets` 는 `if:` 에서 읽을 수 없어 "시크릿 없으면 건너뛰기" 를 조건으로
# 못 쓴다 — 가드 job 을 하나 더 두는 방법이 있지만 PR 마다 러너가 하나 더
# 뜬다. 1인 레포에서는 **머지 시점을 미루는 쪽이 싸다.**

name: Claude

on:
  # 이슈·PR 댓글
  issue_comment:
    types: [created]
  # PR 코드 리뷰의 인라인 댓글
  pull_request_review_comment:
    types: [created]
  # PR 리뷰 본문 ("@claude 이거 고쳐줘" 를 리뷰 코멘트로 적는 경우)
  pull_request_review:
    types: [submitted]
  # 새 이슈의 제목·본문. 이슈가 할 일의 원본이라 여기가 가장 흔한 입구다.
  issues:
    types: [opened]

# 액션이 실제로 쓰는 권한만 준다.
#
# - `contents: write` · `pull-requests: write` — 고치고 PR 을 올린다
# - `issues: write` — 이슈에 답한다
# - `id-token: write` — 액션의 기본 GitHub App 인증에 필요하다 (빼면 인증이 깨진다)
# - `actions: read` — PR 의 CI 결과를 읽는다. CI 가 왜 깨졌는지 보고 고칠 수 있다
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# 같은 이슈/PR 에 연달아 멘션하면 앞선 실행을 **버리지 않는다**.
# ci.yml 과 다른 선택이다 — CI 는 마지막 결과만 보면 되지만, 여기서 앞선
# 실행을 죽이면 Claude 가 코드를 고치던 중간에 끊겨 반쯤 고친 커밋이 남는다.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # 러너를 괜히 띄우지 않는다. 멘션이 어느 필드에 적히는지가 이벤트마다
    # 달라서 네 갈래를 따로 본다 — 한 줄로 합치면 이벤트 하나가 조용히 빠진다.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    # 폭주 방지. 러너가 멈춰 있는 동안에도 Actions 분이 나간다.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Claude 가 커밋을 올려야 하므로 얕게라도 히스토리가 필요하다.
          fetch-depth: 1

      # ---------------------------------------------------------------
      # 여기부터 세 스텝은 **ci.yml 과 같은 셋업**이다. Claude 가 Dart 코드를
      # 고치고 나서 `flutter analyze`·`flutter test` 를 직접 돌릴 수 있어야 한다.
      #
      # 왜 굳이 2~3분을 더 쓰는가 — `test/architecture_test.dart` 가 이
      # 프로젝트의 규약 집행 장치다(화면에서 `showDialog`·`TextField`·
      # `styleFrom` 직접 쓰기, `fontSize:` 직접 적기를 막는다). 셋업을 빼면
      # Claude 는 규약을 깨는 코드를 올리고 **CI 가 PR 에서 깨진다** — 그걸
      # 사람이 다시 받아 고치는 쪽이 셋업 시간보다 비싸다.
      #
      # 질문만 하는 멘션("이거 어떻게 구현하지?")도 이 비용을 낸다. 이벤트
      # 단계에서 질문과 수정을 가를 방법이 없어서 감수한다.
      # ---------------------------------------------------------------

      # `.fvmrc` 의 핀 · ci.yml 과 **같은 버전**이어야 한다. 세 곳이 갈라지면
      # 로컬·CI·Claude 가 서로 다른 Flutter 로 돈다.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      # envied 가 `.env.dev`·`.env.prod` 를 **둘 다** 요구한다 — 하나만 있어도
      # build_runner 가 실패해 생성 코드가 안 나오고 analyze 까지 못 간다.
      #
      # **실제 값을 넣지 않는다.** analyze·test 는 외부 API 를 호출하지 않으므로
      # 더미로 충분하고, 공개 레포에 비밀을 끌어들일 이유가 없다. 이 말은
      # Claude 가 이 러너에서 **앱을 실제로 켜볼 수는 없다**는 뜻이기도 하다 —
      # 시트·Drive·Slack 에 붙는 동작은 사람이 로컬에서 확인한다.
      - name: .env.dev · .env.prod 를 더미 값으로 채운다
        run: |
          sed 's/=$/=ci-dummy/' .env.dev.example > .env.dev
          sed 's/=$/=ci-dummy/' .env.prod.example > .env.prod

      - name: 생성 코드 만들기 (envied · freezed · drift · riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # `github_token` 을 **넘기지 않는다.** 넘기면 Claude 의 커밋이
          # 기본 `GITHUB_TOKEN` 으로 올라가고, GitHub 은 그 토큰으로 만든
          # 커밋에는 워크플로를 띄우지 않는다 — ci.yml 이 Claude 의 PR 에서
          # 안 돈다. 비워두면 Claude GitHub App 으로 인증해 CI 가 돈다.

          claude_args: |
            --max-turns 20
