# build_runner 설정.
#
# ## 왜 필요한가
#
# envied 는 `.env.*` 를 build_runner 의 에셋 그래프가 아니라 dart:io 로 **직접**
# 읽는다. 그래서 `.env.dev` 만 고치면 build_runner 가 "바뀐 게 없다" 고 판단하고
# `wrote 0 outputs` 를 내며 아무것도 안 한다. `touch` 도 안 통한다 —
# mtime 이 아니라 내용 해시로 판단하기 때문이다.
#
# 아래 `sources` 에 두 파일을 넣어 build_runner 가 입력으로 추적하게 한다.
# 이러면 `.env.dev`·`.env.prod` 를 고치는 것만으로 재생성된다.
# **둘 다 있어야 빌드가 된다** — 개발 값만 가진 사람도 `.env.prod` 는
# 자리값(`REPLACE_ME`)으로 채워 둬야 한다(`.env.prod.example` 참고).
#
# 그래도 안 잡히면 마지막 수단:
#   fvm dart run build_runner clean && \
#   fvm dart run build_runner build --delete-conflicting-outputs
targets:
  $default:
    sources:
      - lib/**
      - test/**
      - .env.dev
      - .env.prod
      - $package$
      - pubspec.yaml
