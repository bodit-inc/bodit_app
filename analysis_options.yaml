# very_good_analysis = 엄격한 린트 세트. 사내 앱이지만 혼자 오래 유지할 코드라
# 느슨하게 두면 나중에 못 읽는다.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  plugins:
    - custom_lint          # riverpod_lint 가 여기 붙는다
  exclude:
    - "**/*.g.dart"        # build_runner 생성물 — 린트 대상 아님
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - build/**
    - android/**
    - ios/**
  errors:
    # 생성 코드가 아직 없을 때 IDE 가 빨개지는 걸 막는다 (build_runner 전)
    uri_has_not_been_generated: ignore
    # 위 `plugins: custom_lint` 가 구 플러그인 방식이라 Dart 가 경고를 낸다.
    # `flutter analyze` 는 warning 에도 exit 1 을 내므로 끄지 않으면 CI 가
    # 코드와 무관하게 늘 빨갛다 — 그러면 빨간 CI 가 의미를 잃는다.
    # custom_lint 가 새 플러그인 방식으로 옮겨가면 이 줄을 지운다.
    analysis_options_deprecated_plugins: ignore

linter:
  rules:
    # 한국어 주석을 많이 다는 코드베이스라 문서 주석 강제는 끈다.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Dart 3.13 의 `const new(...)` 축약 문법을 강제하는 규칙.
    # 유효하지만 대부분의 Flutter 예제·다른 사내 프로젝트(3.16·3.27)와 형태가
    # 달라져 읽는 비용만 늘어난다. 관습적인 `const ClassName(...)` 을 쓴다.
    unnecessary_type_name_in_constructor: false
    # private 필드(`_apiKey`)에 public named parameter(`apiKey`)를 받는 패턴을
    # 막는다. 그런데 private 이름은 named parameter 로 쓸 수 없어서
    # (호출부가 `_apiKey:` 를 써야 한다) 제안대로 고칠 수가 없다.
    prefer_initializing_formals: false
